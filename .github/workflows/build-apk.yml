name: Build FinCord APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FinCord-Android-v0.2.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: |
          mkdir -p "$RUNNER_TEMP/fincord"
          unzip -q FinCord-Android-v0.2.zip -d "$RUNNER_TEMP/fincord"
      - name: Build debug APK
        run: gradle -p "$RUNNER_TEMP/fincord" assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinCord-debug-apk
          path: ${{ runner.temp }}/fincord/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
